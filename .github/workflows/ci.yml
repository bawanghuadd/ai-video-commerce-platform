name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-video-commerce-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: npm
          cache-dependency-path: ai-video-commerce-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:architecture
      - run: npm run test:run
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-video-commerce-api
    env:
      APP_ENV: test
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: ci_user
      DB_PASSWORD: ci-placeholder-only
      DB_NAME: ai_video_commerce_ci
      SECRET_KEY: ci-only-secret-not-used-outside-tests
      AUTO_CREATE_SCHEMA: "false"
      SEED_ADMIN: "false"
      SEED_SYSTEM_SETTINGS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-video-commerce-api/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall app
      - run: python -m pytest -q
